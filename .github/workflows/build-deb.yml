name: Compilación Automática de Paquetes (.deb Linux & .apk Android)

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-packages:
    name: 📦 Compilar Recursos Cockpit (.deb & .apk)
    runs-on: ubuntu-24.04

    steps:
      - name: 📥 Clonar Repositorio
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 🛠️ Instalar Dependencias Linux (.deb) (Offline-First)
        run: |
          chmod +x packages/scripts/*.sh
          bash packages/scripts/install_packages.sh

      - name: ☕ Configurar Java JDK 17 para Android (Node 24)
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: 🚀 Compilar y Empaquetar Linux (.deb)
        run: |
          chmod +x packaging/build_deb.sh
          bash packaging/build_deb.sh

      - name: 🤖 Compilar APK Nativo de Android
        run: |
          cd android_app
          chmod +x gradlew
          ./gradlew assembleRelease
          cd ..
          VERSION=$(cat VERSION | tr -d '[:space:]')
          mkdir -p dist
          APK_FILE=$(find android_app/app/build/outputs/apk/release/ -type f -name "*.apk" | head -n 1)
          if [ -n "$APK_FILE" ] && [ -f "$APK_FILE" ]; then
            cp "$APK_FILE" "dist/recursos-cockpit_${VERSION}.apk"
            cp "$APK_FILE" "dist/recursos-cockpit.apk"
            echo "✅ APK copiado: dist/recursos-cockpit_${VERSION}.apk"
          else
            echo "❌ Error: No se encontró APK compilado en release"
            exit 1
          fi

      - name: 🔐 Calcular Sumas SHA256 de Todos los Paquetes
        run: |
          cd dist
          sha256sum *.deb *.apk > SHA256SUMS.txt
          cd ..

      - name: 📋 Extraer Información de Versión
        id: pkg_info
        run: |
          VERSION=$(cat VERSION | tr -d '[:space:]')
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "tag_name=v$VERSION" >> $GITHUB_OUTPUT

      - name: 📤 Subir Artefactos de Compilación
        uses: actions/upload-artifact@v4
        with:
          name: recursos-cockpit-${{ steps.pkg_info.outputs.version }}-binaries
          path: |
            dist/*.deb
            dist/*.apk
            dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30

      - name: 🏷️ Asegurar Etiqueta Git para la Release
        run: |
          TAG_NAME="v${{ steps.pkg_info.outputs.version }}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if ! git rev-parse "$TAG_NAME" >/dev/null 2>&1; then
            echo "Creando etiqueta local $TAG_NAME..."
            git tag -a "$TAG_NAME" -m "Recursos Cockpit $TAG_NAME"
          fi
          echo "Sincronizando etiqueta $TAG_NAME con origin..."
          git push origin "$TAG_NAME" || true

      - name: 🚀 Publicar en GitHub Releases (Público y Descargable)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.pkg_info.outputs.version }}
          name: Recursos Cockpit v${{ steps.pkg_info.outputs.version }}
          files: |
            dist/*.deb
            dist/*.apk
            dist/SHA256SUMS.txt
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
