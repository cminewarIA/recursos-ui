name: Compilación Automática de Paquetes Firmados (.deb Linux & .apk Android)

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-packages:
    name: 📦 Compilar y Firmar Recursos Cockpit (.deb & .apk)
    runs-on: ubuntu-24.04

    steps:
      - name: 📥 Clonar Repositorio
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 🛠️ Instalar Dependencias Linux (.deb) (Offline-First)
        run: |
          chmod +x packages/scripts/*.sh
          bash packages/scripts/install_packages.sh

      - name: 🌐 Configurar Node.js y Compilar Interfaz Unificada (static/index.html)
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: |
          npm install --no-audit --no-fund
          npm run build

      - name: ☕ Configurar Java JDK 17 para Android (Node 24)
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: 🚀 Compilar y Firmar Paquete Linux (.deb + GPG)
        env:
          DEB_GPG_PRIVATE_KEY: ${{ secrets.DEB_GPG_PRIVATE_KEY }}
          DEB_GPG_PASSPHRASE: ${{ secrets.DEB_GPG_PASSPHRASE }}
        run: |
          chmod +x packaging/build_deb.sh
          bash packaging/build_deb.sh

      - name: 🤖 Compilar y Verificar Firma Oficial del APK de Android
        run: |
          cd android_app
          chmod +x gradlew
          ./gradlew assembleRelease
          cd ..
          VERSION=$(cat VERSION | tr -d '[:space:]')
          mkdir -p dist
          APK_FILE=$(find android_app/app/build/outputs/apk/release/ -type f -name "*.apk" ! -name "*unsigned*" | head -n 1)
          if [ -n "$APK_FILE" ] && [ -f "$APK_FILE" ]; then
            cp "$APK_FILE" "dist/recursos-cockpit_${VERSION}.apk"
            cp "$APK_FILE" "dist/recursos-cockpit.apk"
            APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner 2>/dev/null | sort -V | tail -n 1 || true)
            if [ -n "$APKSIGNER" ]; then
              "$APKSIGNER" verify --print-certs "dist/recursos-cockpit_${VERSION}.apk"
            fi
            echo "✅ APK firmado y verificado: dist/recursos-cockpit_${VERSION}.apk"
          else
            echo "❌ Error: No se encontró APK firmado en release"
            exit 1
          fi

      - name: 🔐 Calcular Sumas SHA256 y Firma GPG de Todos los Paquetes
        env:
          DEB_GPG_PRIVATE_KEY: ${{ secrets.DEB_GPG_PRIVATE_KEY }}
          DEB_GPG_PASSPHRASE: ${{ secrets.DEB_GPG_PASSPHRASE }}
        run: |
          cd dist
          sha256sum *.deb *.apk > SHA256SUMS.txt
          cd ..
          python3 packaging/sign_deb.py --sha-only dist/SHA256SUMS.txt || true

      - name: 📋 Extraer Información de Versión
        id: pkg_info
        run: |
          VERSION=$(cat VERSION | tr -d '[:space:]')
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "tag_name=v$VERSION" >> $GITHUB_OUTPUT

      - name: 📤 Subir Artefactos de Compilación
        uses: actions/upload-artifact@v4
        with:
          name: recursos-cockpit-${{ steps.pkg_info.outputs.version }}-binaries
          path: |
            dist/*.deb
            dist/*.deb.asc
            dist/*.apk
            dist/*.gpg
            dist/*.asc
            dist/SHA256SUMS.txt
            dist/SHA256SUMS.txt.asc
          if-no-files-found: error
          retention-days: 30

      - name: 🏷️ Asegurar Etiqueta Git para la Release
        run: |
          TAG_NAME="v${{ steps.pkg_info.outputs.version }}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if ! git rev-parse "$TAG_NAME" >/dev/null 2>&1; then
            echo "Creando etiqueta local $TAG_NAME..."
            git tag -a "$TAG_NAME" -m "Recursos Cockpit $TAG_NAME"
          fi
          echo "Sincronizando etiqueta $TAG_NAME con origin..."
          git push origin "$TAG_NAME" || true

      - name: 🚀 Publicar en GitHub Releases (Público y Descargable)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.pkg_info.outputs.version }}
          name: Recursos Cockpit v${{ steps.pkg_info.outputs.version }}
          files: |
            dist/*.deb
            dist/*.deb.asc
            dist/*.apk
            dist/*.gpg
            dist/*.asc
            dist/SHA256SUMS.txt
            dist/SHA256SUMS.txt.asc
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
