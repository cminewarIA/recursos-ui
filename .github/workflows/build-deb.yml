name: Compilación Automática de Paquetes (.deb Linux & .apk Android)

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-packages:
    name: 📦 Compilar Recursos Cockpit (.deb & .apk)
    runs-on: ubuntu-24.04

    steps:
      - name: 📥 Clonar Repositorio
        uses: actions/checkout@v7

      - name: 🛠️ Instalar Dependencias Linux (.deb) (Offline-First)
        run: |
          chmod +x packages/scripts/*.sh
          bash packages/scripts/install_packages.sh

      - name: ☕ Configurar Java JDK 17 para Android
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: ⚡ Configurar y Acelerar Caché de Gradle y Dependencias
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.5'
          cache-read-only: false

      - name: 🚀 Compilar y Empaquetar Linux (.deb)
        run: |
          chmod +x packaging/build_deb.sh
          bash packaging/build_deb.sh

      - name: 🤖 Compilar APK Nativo de Android
        run: |
          cd android_app
          chmod +x gradlew
          ./gradlew assembleRelease
          cd ..
          VERSION=$(cat VERSION | tr -d '[:space:]')
          cp android_app/app/build/outputs/apk/release/app-release.apk dist/recursos-cockpit_${VERSION}.apk
          cp android_app/app/build/outputs/apk/release/app-release.apk dist/recursos-cockpit.apk

      - name: 🔐 Calcular Sumas SHA256 de Todos los Paquetes
        run: |
          cd dist
          sha256sum *.deb *.apk > SHA256SUMS.txt
          cd ..

      - name: 📋 Extraer Información de Versión
        id: pkg_info
        run: |
          VERSION=$(cat VERSION | tr -d '[:space:]')
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: 📤 Subir Artefactos de Compilación
        uses: actions/upload-artifact@v7
        with:
          name: recursos-cockpit-${{ steps.pkg_info.outputs.version }}-binaries
          path: |
            dist/*.deb
            dist/*.apk
            dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30

      - name: 🏷️ Publicar en GitHub Releases (Público y Descargable)
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ steps.pkg_info.outputs.version }}
          name: Recursos Cockpit v${{ steps.pkg_info.outputs.version }}
          files: |
            dist/*.deb
            dist/*.apk
            dist/SHA256SUMS.txt
          generate_release_notes: true
          draft: false
          prerelease: false
