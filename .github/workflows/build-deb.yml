name: Compilación Automática de Paquete Linux (.deb)

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-deb:
    name: 📦 Compilar recursos-cockpit.deb
    runs-on: ubuntu-24.04

    steps:
      - name: 📥 Clonar Repositorio
        uses: actions/checkout@v7

      - name: 🛠️ Instalar Dependencias de Compilación
        run: |
          sudo apt-get update
          sudo apt-get install -y dpkg-dev binutils

      - name: 🚀 Compilar y Empaquetar .deb
        run: |
          chmod +x packaging/build_deb.sh
          bash packaging/build_deb.sh

      - name: 📋 Extraer Información del Paquete
        id: pkg_info
        run: |
          VERSION=$(cat VERSION | tr -d '[:space:]')
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "deb_path=dist/recursos-cockpit_${VERSION}_amd64.deb" >> $GITHUB_OUTPUT

      - name: 📤 Subir Artefactos de Compilación
        uses: actions/upload-artifact@v7
        with:
          name: recursos-cockpit-${{ steps.pkg_info.outputs.version }}-deb
          path: |
            dist/*.deb
            dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30

      - name: 🏷️ Publicar en GitHub Releases (Público y Descargable)
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ steps.pkg_info.outputs.version }}
          name: Recursos Cockpit v${{ steps.pkg_info.outputs.version }}
          files: |
            dist/*.deb
            dist/SHA256SUMS.txt
          generate_release_notes: true
          draft: false
          prerelease: false
